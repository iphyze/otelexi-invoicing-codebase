<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a56db" />
    <title>Otelex | Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "DM Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fc;
        color: #10203c;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 12%, rgba(37, 99, 235, .12), transparent 30%),
          radial-gradient(circle at 88% 84%, rgba(56, 189, 248, .09), transparent 26%),
          #f7f9fc;
      }

      .offline-card {
        width: min(470px, 100%);
        padding: 34px;
        border: 1px solid #e3e9f3;
        border-radius: 24px;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 24px 65px rgba(15, 23, 42, .10);
        text-align: center;
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        padding: 10px;
        border-radius: 20px;
        background: #eff5ff;
        display: grid;
        place-items: center;
      }

      .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 11px;
        border-radius: 999px;
        background: #edf4ff;
        color: #1a56db;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(25px, 5vw, 32px);
        line-height: 1.12;
        letter-spacing: -.04em;
      }

      p {
        margin: 0 auto;
        max-width: 370px;
        color: #64748b;
        font-size: 15px;
        line-height: 1.65;
      }

      .notice {
        margin: 22px 0;
        padding: 13px 14px;
        border-radius: 14px;
        color: #475569;
        background: #f8fafc;
        border: 1px solid #e8edf5;
        font-size: 13px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 12px 24px rgba(37, 99, 235, .22);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover { filter: brightness(1.04); }
      button:focus-visible { outline: 3px solid rgba(37, 99, 235, .25); outline-offset: 3px; }

      @media (prefers-color-scheme: dark) {
        :root { background: #0b1427; color: #f8fafc; }
        body {
          background:
            radial-gradient(circle at 18% 12%, rgba(37, 99, 235, .18), transparent 30%),
            radial-gradient(circle at 88% 84%, rgba(56, 189, 248, .08), transparent 26%),
            #0b1427;
        }
        .offline-card { background: rgba(15, 27, 50, .96); border-color: rgba(148, 163, 184, .15); box-shadow: 0 26px 70px rgba(0,0,0,.28); }
        .logo-wrap { background: rgba(37, 99, 235, .12); }
        .eyebrow { background: rgba(37, 99, 235, .14); color: #78a7ff; }
        p { color: #9eacc0; }
        .notice { color: #b8c4d4; background: rgba(255,255,255,.035); border-color: rgba(148,163,184,.13); }
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="logo-wrap">
        <img src="/pwa/icon-192.png" alt="Otelex" />
      </div>
      <span class="eyebrow">Connection unavailable</span>
      <h1>You’re currently offline</h1>
      <p>Otelex needs an internet connection to load live invoices, payments, stock and other business data safely.</p>
      <div class="notice">Your financial records are not served from a stale offline copy. Reconnect to continue with the latest information.</div>
      <button id="retry-button" type="button" onclick="window.location.reload()">Try Again</button>
      <script>
        window.addEventListener('online', function () {
          var button = document.getElementById('retry-button');
          if (button) {
            button.textContent = 'Connection restored…';
            button.disabled = true;
          }
          window.setTimeout(function () { window.location.reload(); }, 350);
        });
      </script>
    </main>
  </body>
</html>
